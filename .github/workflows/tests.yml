# =======================================================
# รัน Test อัตโนมัติทุกครั้งที่ Push ขึ้น main หรือเปิด Pull Request
# - Laravel: php artisan test (PHP 8.4 เหมือน Laravel Cloud)
# - Flutter: flutter analyze
#
# ผลดูได้ที่แท็บ Actions บน GitHub (✅ ผ่าน / ❌ ไม่ผ่าน)
# หมายเหตุ: Laravel Cloud ยัง Deploy ทุกครั้งที่ Push
# ถ้าขึ้น ❌ ให้แก้แล้ว Push ใหม่ทันที
# =======================================================

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  laravel:
    name: Laravel tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: family_api

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_sqlite, sqlite3, mbstring, fileinfo
          coverage: none

      # composer install รันคำสั่ง artisan ด้วย จึงต้องมี .env ก่อน
      - name: Prepare .env
        run: cp .env.example .env

      - name: Install Composer packages
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate app key
        run: php artisan key:generate

      - name: Run tests
        run: php artisan test

  flutter:
    name: Flutter analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: family_app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
